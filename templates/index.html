<!DOCTYPE html>
<html>
<head>
    <title>KUSH Tool</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 40px;
            color: #ffd700;
            text-shadow: 0 0 10px #ffb300, 0 0 20px #ffb300;
        }

        .box {
            margin-top: 40px;
        }

        input {
            padding: 12px;
            width: 250px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: linear-gradient(45deg, #ffb300, #ffd700);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: black;
            box-shadow: 0 0 10px #ffb300;
        }

        button:hover {
            box-shadow: 0 0 20px #ffd700;
        }

        footer {
            margin-top: 60px;
            color: #888;
        }
    </style>
</head>

<body>

    <h1>🔥 KUSH TOOL 🔥</h1>

    <div class="box">
        <p>Enter username</p>
        <input placeholder="Enter username"><br>
        <button>Start</button>
    </div>

    <footer>
        <p>© 2026 KUSH Tool</p>
    </footer>

</body>
</html>
